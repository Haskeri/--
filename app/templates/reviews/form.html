{% extends 'base.html' %}

{% block title %}Написать рецензию — {{ book.title }}{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('books.index') }}">Главная</a></li>
        <li class="breadcrumb-item">
            <a href="{{ url_for('books.detail', book_id=book.id) }}">{{ book.title }}</a>
        </li>
        <li class="breadcrumb-item active">Написать рецензию</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-transparent border-0 pt-4 px-4">
                <h3 class="fw-bold mb-1">
                    <i class="bi bi-pencil-square me-2 text-primary"></i>Написать рецензию
                </h3>
                <p class="text-muted mb-0">Книга: <strong>{{ book.title }}</strong></p>
            </div>
            <div class="card-body px-4 pb-4">
                <form method="POST" novalidate>
                    <div class="mb-4">
                        <label for="rating" class="form-label fw-semibold">
                            Оценка <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="rating" name="rating" required>
                            <option value="5" {% if form_data.get('rating', '5') == '5' %}selected{% endif %}>
                                5 — Отлично
                            </option>
                            <option value="4" {% if form_data.get('rating') == '4' %}selected{% endif %}>
                                4 — Хорошо
                            </option>
                            <option value="3" {% if form_data.get('rating') == '3' %}selected{% endif %}>
                                3 — Удовлетворительно
                            </option>
                            <option value="2" {% if form_data.get('rating') == '2' %}selected{% endif %}>
                                2 — Неудовлетворительно
                            </option>
                            <option value="1" {% if form_data.get('rating') == '1' %}selected{% endif %}>
                                1 — Плохо
                            </option>
                            <option value="0" {% if form_data.get('rating') == '0' %}selected{% endif %}>
                                0 — Ужасно
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="text" class="form-label fw-semibold">
                            Текст рецензии <span class="text-danger">*</span>
                        </label>
                        <textarea class="form-control" id="text" name="text" rows="8"
                                  placeholder="Поделитесь своим мнением о книге (поддерживается Markdown)">{{ form_data.get('text', '') }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-send me-1"></i>Отправить на рассмотрение
                        </button>
                        <a href="{{ url_for('books.detail', book_id=book.id) }}"
                           class="btn btn-outline-secondary px-4">
                            <i class="bi bi-x-lg me-1"></i>Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
new EasyMDE({
    element: document.getElementById('text'),
    spellChecker: false,
    placeholder: 'Поделитесь своим мнением о книге...',
    toolbar: ['bold', 'italic', '|', 'quote', 'unordered-list', '|', 'preview', '|', 'guide'],
    status: false,
});
</script>
{% endblock %}
