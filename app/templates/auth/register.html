{% extends 'base.html' %}

{% block title %}Регистрация — Электронная библиотека{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                 style="width:72px;height:72px;background:linear-gradient(135deg,#4f46e5,#7c3aed);">
                <i class="bi bi-person-plus text-white" style="font-size:1.8rem;"></i>
            </div>
            <h3 class="fw-bold mb-1">Создать аккаунт</h3>
            <p class="text-muted">Зарегистрируйтесь чтобы оставлять рецензии</p>
        </div>

        <div class="card form-card p-4">
            <form method="POST" novalidate>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small text-uppercase text-muted">
                            Фамилия <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" name="last_name"
                               placeholder="Иванов" required
                               value="{{ form_data.get('last_name', '') }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small text-uppercase text-muted">
                            Имя <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" name="first_name"
                               placeholder="Иван" required
                               value="{{ form_data.get('first_name', '') }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small text-uppercase text-muted">Отчество</label>
                    <input type="text" class="form-control" name="middle_name"
                           placeholder="Иванович (необязательно)"
                           value="{{ form_data.get('middle_name', '') }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small text-uppercase text-muted">
                        Логин <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" name="login"
                               placeholder="Придумайте логин" required
                               value="{{ form_data.get('login', '') }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small text-uppercase text-muted">
                        Пароль <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 ps-0" name="password"
                               placeholder="Минимум 6 символов" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small text-uppercase text-muted">
                        Повторите пароль <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock-fill text-muted"></i>
                        </span>
                        <input type="password" class="form-control border-start-0 ps-0" name="password2"
                               placeholder="Повторите пароль" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary fw-semibold py-2 rounded-pill"
                            style="background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;">
                        <i class="bi bi-person-check me-2"></i>Зарегистрироваться
                    </button>
                </div>

                <p class="text-center text-muted small mb-0">
                    Уже есть аккаунт?
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Войти</a>
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
